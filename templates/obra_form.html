{% extends "base.html" %}
{% block title %}{{ accion }} Obra — ESMA{% endblock %}
{% block page_title %}{{ accion }} Obra{% endblock %}
{% block content %}
<div class="card" style="max-width:600px">
  <div class="card-hd"><h3>Datos de la obra</h3></div>
  <div class="card-bd">
    <form method="POST">
      <div class="form-group"><label>Nombre de la obra *</label>
        <input class="form-control" name="nombre" value="{{ obra.nombre if obra else '' }}" required></div>
      <div class="form-group"><label>Cliente / Contratante</label>
        <input class="form-control" name="cliente" value="{{ obra.cliente if obra else '' }}"></div>
      <div class="form-group"><label>Ubicación</label>
        <input class="form-control" name="ubicacion" value="{{ obra.ubicacion if obra else '' }}" placeholder="Palmillas - Querétaro"></div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Fecha inicio</label>
          <input class="form-control" type="date" name="fecha_inicio" value="{{ obra.fecha_inicio if obra else '' }}"></div></div>
        <div class="col"><div class="form-group"><label>Fecha fin estimada</label>
          <input class="form-control" type="date" name="fecha_fin" value="{{ obra.fecha_fin if obra else '' }}"></div></div>
      </div>
      <div class="form-group"><label>Estado</label>
        <select class="form-control" name="estado">
          {% for e in ['activa','pausada','terminada'] %}
          <option value="{{ e }}" {{ 'selected' if obra and obra.estado==e }}>{{ e|capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Link Google Drive (carpeta compartida)</label>
        <input class="form-control" name="link_drive" value="{{ obra.link_drive if obra and obra.link_drive else '' }}" placeholder="https://drive.google.com/drive/folders/...">
        <small style="color:var(--mt)">URL de la carpeta de Drive donde la obra sube sus archivos</small>
      </div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">{{ accion }} obra</button>
        <a href="{{ url_for('obras') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
