{% extends "base.html" %}
{% block title %}Nuevo Análisis de Compra — ESMA{% endblock %}
{% block page_title %}Nuevo Análisis de Compra{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <div class="card-hd"><h3>Qué se está cotizando</h3></div>
  <div class="card-bd">
    <form method="POST">
      <div class="form-group"><label>Descripción</label>
        <input class="form-control" name="descripcion" placeholder="Ej: Refuerzo estructural cajón 11+041.85" required></div>
      <div class="form-group"><label>Obra</label>
        <select class="form-control" name="id_obra">
          <option value="">— Sin obra específica —</option>
          {% for o in obras %}<option value="{{ o.id }}">{{ o.nombre }}</option>{% endfor %}
        </select></div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Requisitante</label>
          <input class="form-control" name="requisitante"></div></div>
        <div class="col"><div class="form-group"><label>Fecha</label>
          <input class="form-control" type="date" name="fecha"></div></div>
      </div>
      <div class="form-group"><label>Observaciones</label>
        <textarea class="form-control" name="observaciones" rows="2"></textarea></div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">Crear y agregar cotizaciones</button>
        <a href="{{ url_for('analisis_compra') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
