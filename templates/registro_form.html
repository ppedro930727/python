{% extends "base.html" %}
{% block title %}Nuevo registro — ESMA{% endblock %}
{% block page_title %}Nuevo registro diario{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('registro') }}">Registro diario</a> · Nuevo{% endblock %}
{% block content %}
<div class="card" style="max-width:620px">
  <div class="card-hd"><h3>Bitácora del día</h3></div>
  <div class="card-bd">
    <form method="POST">
      <div class="row">
        <div class="col"><div class="form-group"><label>Fecha *</label>
          <input class="form-control" type="date" name="fecha" value="{{ hoy }}" required></div></div>
        <div class="col"><div class="form-group"><label>Obra</label>
          <select class="form-control" name="id_obra">
            <option value="">— Ninguna —</option>
            {% for o in obras %}<option value="{{ o.id }}">{{ o.nombre }}</option>{% endfor %}
          </select></div></div>
      </div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Autor</label>
          <input class="form-control" name="autor" placeholder="Quien registra"></div></div>
        <div class="col"><div class="form-group"><label>Clima</label>
          <input class="form-control" name="clima" placeholder="Soleado / Lluvia..."></div></div>
        <div class="col"><div class="form-group"><label>Equipos activos</label>
          <input class="form-control" type="number" name="equipos_activos" placeholder="0"></div></div>
      </div>
      <div class="form-group"><label>Notas del día</label>
        <textarea class="form-control" name="notas" rows="4" placeholder="Avances, novedades, pendientes..."></textarea></div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">Guardar registro</button>
        <a href="{{ url_for('registro') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
