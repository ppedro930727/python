{% extends "base.html" %}
{% block title %}Nueva inspección — ESMA{% endblock %}
{% block page_title %}Nueva inspección{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('inspecciones') }}">Inspecciones</a> · Nueva{% endblock %}
{% block content %}
<div class="card" style="max-width:680px">
  <div class="card-hd"><h3>Datos de la inspección</h3></div>
  <div class="card-bd">
    <form method="POST">
      <div class="row">
        <div class="col"><div class="form-group"><label>Fecha *</label>
          <input class="form-control" type="date" name="fecha" value="{{ hoy }}" required></div></div>
        <div class="col"><div class="form-group"><label>Inspector</label>
          <input class="form-control" name="inspector" placeholder="Nombre del inspector"></div></div>
      </div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Equipo (ECO)</label>
          <input class="form-control" name="codigo_eco" list="ecos" placeholder="EXC-001">
          <datalist id="ecos">{% for m in maquinas %}<option value="{{ m.eco }}">{{ m.nombre_equipo }}</option>{% endfor %}</datalist>
        </div></div>
        <div class="col"><div class="form-group"><label>Obra</label>
          <select class="form-control" name="id_obra">
            <option value="">— Ninguna —</option>
            {% for o in obras %}<option value="{{ o.id }}">{{ o.nombre }}</option>{% endfor %}
          </select></div></div>
      </div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Tipo</label>
          <select class="form-control" name="tipo">
            {% for t in ['rutinaria','combustible','mantenimiento','seguridad'] %}
            <option value="{{ t }}">{{ t|capitalize }}</option>{% endfor %}
          </select></div></div>
        <div class="col"><div class="form-group"><label>Resultado</label>
          <select class="form-control" name="resultado">
            <option value="conforme">Conforme</option>
            <option value="observaciones">Con observaciones</option>
            <option value="no_conforme">No conforme</option>
          </select></div></div>
        <div class="col"><div class="form-group"><label>Severidad</label>
          <select class="form-control" name="severidad">
            {% for s in ['bajo','medio','alto','critico'] %}
            <option value="{{ s }}">{{ s|capitalize }}</option>{% endfor %}
          </select></div></div>
      </div>
      <div class="form-group"><label>Hallazgos</label>
        <textarea class="form-control" name="hallazgos" rows="3" placeholder="Describe los hallazgos de la inspección..."></textarea></div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">Registrar inspección</button>
        <a href="{{ url_for('inspecciones') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
