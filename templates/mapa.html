{% extends "base.html" %}
{% block title %}Mapa GPS — ESMA{% endblock %}
{% block page_title %}Mapa GPS de flota{% endblock %}
{% block breadcrumb %}Telemetría · Posición de flota{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ── 1. Altura blindada para PC y Móvil con dvh ── */
  .mapa-wrap{
    display:flex;
    gap:14px;
    height:calc(100vh - 130px);
    min-height: 450px;
  }
  
  .mapa-side{
    width:320px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    background:var(--s1);
    border:1px solid var(--bd);
    border-radius:var(--r);
    overflow:hidden;
  }
  
  .mapa-side .hd{padding:12px 14px;border-bottom:1px solid var(--bd);}
  .mapa-side .hd input{
    width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--bd);
    background:var(--bg);color:var(--tx);font-size:13px;outline:none;
  }
  .mapa-side .hd input:focus{border-color:var(--ac);}
  
  .mapa-cont{
    padding:8px 12px;font-size:11px;color:var(--mt);border-bottom:1px solid var(--bd);
    display:flex;gap:12px;flex-wrap:wrap;
  }
  .mapa-cont b{color:var(--tx);}
  .mapa-list{flex:1;overflow-y:auto;}
  
  .mq{
    display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
    border-bottom:1px solid var(--s2);transition:background .12s;
  }
  .mq:hover{background:var(--s2);}
  .mq.sel{background:var(--s2);border-left:3px solid var(--ac);}
  .mq .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .mq .info{flex:1;min-width:0;}
  .mq .eco{font-family:monospace;font-weight:700;font-size:12px;color:var(--ac);}
  .mq .nom{font-size:11px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  
  .mq .tag{font-size:9px;padding:1px 5px;border-radius:8px;flex-shrink:0;font-weight:600;}
  .tag-gps{background:rgba(63,185,80,.15);color:var(--ok);}
  .tag-obra{background:rgba(210,153,34,.15);color:var(--wn);}
  .tag-sin{background:rgba(248,81,73,.15);color:var(--dg);}
  
  #mapa{flex:1;border-radius:var(--r);border:1px solid var(--bd);width:100%;height:100%;z-index:1;}
  
  .eq-popup{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-width:190px;}
  .eq-popup .eco{font-weight:700;color:#3B3F9E;font-family:monospace;font-size:14px;}
  .eq-popup .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;}

  /* ── 2. SOLUCIÓN RESPONSIVA MÓVIL (< 768px) ── */
  @media (max-width: 768px) {
    .mapa-wrap {
      flex-direction: column; /* Apila el buscador sobre el mapa */
      height: calc(100dvh - 140px) !important; /* Altura del viewport móvil real */
      gap: 8px;
    }
    .mapa-side {
      width: 100% !important;
      height: 38% !important; /* La lista toma un tercio de la pantalla */
      max-height: 220px;
    }
    #mapa {
      height: 62% !important; /* El mapa toma el resto en celular */
      min-height: 250px;
    }
  }
</style>
{% endblock %}
{% block content %}
<div class="mapa-wrap">
  <!-- Panel lateral: lista de maquinas -->
  <div class="mapa-side">
    <div class="hd">
      <input id="buscar" type="text" placeholder="Buscar ECO, equipo o marca...">
    </div>
    <div class="mapa-cont" id="contadores">Cargando flota...</div>
    <div class="mapa-list" id="lista"></div>
  </div>
  <!-- Mapa -->
  <div id="mapa"></div>
</div>

<script>
const map = L.map('mapa').setView([23.5, -101.5], 5);
var capaCalles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);
var capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:19, attribution:'© Esri'
});
L.control.layers({'Calles':capaCalles,'Satelite':capaSatelite}).addTo(map);

/* ── 3. TRUCO DE RECALCULADO LEAFLET EN MÓVIL ── */
// Fuerza al navegador a redibujar el mapa una vez que el CSS móvil se aplicó
setTimeout(function() {
  map.invalidateSize();
}, 400);

window.addEventListener("orientationchange", function() {
  setTimeout(function() { map.invalidateSize(); }, 300);
});
window.addEventListener("resize", function() {
  map.invalidateSize();
});

let EQUIPOS = [];          // datos crudos del API
const markers = {};        // codigo_eco -> marker

function colorNivel(n){
  n = parseFloat(n);
  if(isNaN(n)) return '#7d8590';
  return n>50?'#3fb950':n>25?'#d29922':'#f85149';
}

function crearIcono(eq){
  const color = colorNivel(eq.nivel_combustible);
  // ubicacion aproximada (obra) -> borde punteado para distinguir del GPS real
  const borde = eq.fuente_ubicacion==='gps' ? '2px solid #fff' : '2px dashed #fff';
  const corto = (eq.codigo_eco||'').split('-')[0];
  return L.divIcon({
    html:`<div style="background:${color};border:${borde};border-radius:50% 50% 50% 0;
          width:28px;height:28px;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4);
          display:flex;align-items:center;justify-content:center">
          <span style="transform:rotate(45deg);color:#fff;font-size:7px;font-weight:700;line-height:1">${corto}</span>
          </div>`,
    className:'',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-30]
  });
}

function popupContent(eq){
  const n = parseFloat(eq.nivel_combustible)||0;
  const bc = colorNivel(n);
  return `<div class="eq-popup">
    <div class="eco">${eq.codigo_eco}</div>
    <div style="font-size:12px;color:#666;margin-bottom:8px">${eq.nombre_equipo||''} · ${eq.marca||''} ${eq.modelo||''}</div>
    ${eq.serie?`<div class="r"><span style="color:#666">Serie</span><span style="font-size:11px">${eq.serie}</span></div>`:''}
    <div class="r"><span style="color:#666">Combustible</span>
      <span style="font-weight:600;color:${bc}">${n.toFixed(1)}%</span></div>
    <div class="r"><span style="color:#666">Horómetro</span>
      <span>${eq.horas_totales_horometro?parseFloat(eq.horas_totales_horometro).toLocaleString()+' h':'—'}</span></div>
    <div class="r"><span style="color:#666">Actualización</span>
      <span style="font-size:11px">${eq.fecha_ultima_actualizacion?new Date(eq.fecha_ultima_actualizacion).toLocaleString('es-MX'):'—'}</span></div>
    <div style="margin-top:8px">
      <a href="/maquinas/${eq.codigo_eco}" style="background:#3B3F9E;color:#fff;padding:4px 10px;
         border-radius:4px;font-size:12px;font-weight:600;text-decoration:none">Ver detalle →</a>
    </div>
  </div>`;
}

function dibujarMarcadores(){
  EQUIPOS.forEach(eq=>{
    if(eq.latitud==null || eq.longitud==null) return;   // sin ubicacion
    const lat=parseFloat(eq.latitud), lon=parseFloat(eq.longitud);
    if(markers[eq.codigo_eco]){
      markers[eq.codigo_eco].setLatLng([lat,lon]);
      markers[eq.codigo_eco].setIcon(crearIcono(eq));
      markers[eq.codigo_eco].setPopupContent(popupContent(eq));
    } else {
      markers[eq.codigo_eco]=L.marker([lat,lon],{icon:crearIcono(eq)})
        .addTo(map).bindPopup(popupContent(eq));
    }
  });
}

function enfocar(eq){
  if(eq.latitud==null || eq.longitud==null) return;
  const lat=parseFloat(eq.latitud), lon=parseFloat(eq.longitud);
  map.setView([lat,lon], 14, {animate:true});
  if(markers[eq.codigo_eco]) markers[eq.codigo_eco].openPopup();
  document.querySelectorAll('.mq').forEach(e=>e.classList.remove('sel'));
  const item=document.getElementById('mq-'+eq.codigo_eco);
  if(item) {
    item.classList.add('sel');
    // En móvil, hacemos scroll suave en la lista para que el usuario sepa que se seleccionó
    item.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }
}

function tagFuente(f){
  if(f==='gps')  return '<span class="tag tag-gps">GPS</span>';
  if(f==='obra') return '<span class="tag tag-obra">obra</span>';
  return '<span class="tag tag-sin">sin ubic.</span>';
}

function renderLista(filtro=''){
  const cont=document.getElementById('lista');
  const q=filtro.trim().toLowerCase();
  const items=EQUIPOS.filter(eq=>{
    if(!q) return true;
    return (eq.codigo_eco||'').toLowerCase().includes(q)
        || (eq.nombre_equipo||'').toLowerCase().includes(q)
        || (eq.marca||'').toLowerCase().includes(q);
  });
  if(!items.length){
    cont.innerHTML='<div style="padding:20px;text-align:center;color:var(--mt);font-size:12px">Sin coincidencias</div>';
    return;
  }
  cont.innerHTML=items.map(eq=>`
    <div class="mq" id="mq-${eq.codigo_eco}" onclick='__sel("${eq.codigo_eco}")'>
      <span class="dot" style="background:${colorNivel(eq.nivel_combustible)}"></span>
      <div class="info">
        <div class="eco">${eq.codigo_eco}</div>
        <div class="nom">${eq.nombre_equipo||'—'} · ${eq.marca||''}</div>
      </div>
      ${tagFuente(eq.fuente_ubicacion)}
    </div>`).join('');
}

window.__sel=function(eco){
  const eq=EQUIPOS.find(x=>x.codigo_eco===eco);
  if(eq) enfocar(eq);
};

function actualizarContadores(){
  const gps=EQUIPOS.filter(e=>e.fuente_ubicacion==='gps').length;
  const sin=EQUIPOS.filter(e=>e.fuente_ubicacion==='sin_ubicacion').length;
  document.getElementById('contadores').innerHTML=
    `<span><b>${EQUIPOS.length}</b> equipos</span>`+
    `<span style="color:var(--ok)"><b>${gps}</b> con GPS</span>`+
    (sin?`<span style="color:var(--dg)"><b>${sin}</b> sin ubic.</span>`:'');
}

function adjustingView(){
  const pts=EQUIPOS.filter(e=>e.latitud!=null && e.longitud!=null)
                   .map(e=>[parseFloat(e.latitud),parseFloat(e.longitud)]);
  if(pts.length) {
    map.fitBounds(pts,{padding:[40,40],maxZoom:12});
    // Después del zoom inicial, recalcular por si acaso en celulares
    setTimeout(() => map.invalidateSize(), 200);
  }
}

function cargar(primera=false){
  fetch('/api/mapa').then(r=>r.json()).then(data=>{
    EQUIPOS=data;
    dibujarMarcadores();
    renderLista(document.getElementById('buscar').value);
    actualizarContadores();
    if(primera) adjustingView();
  }).catch(()=>{
    document.getElementById('contadores').innerHTML=
      '<span style="color:var(--dg)">Error al cargar la flota</span>';
  });
}

document.getElementById('buscar').addEventListener('input',e=>renderLista(e.target.value));

cargar(true);
const socket=io();
socket.on('actualizacion',()=>cargar(false));
setInterval(()=>cargar(false), 20000);
</script>
{% endblock %}
