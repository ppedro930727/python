{% extends "base.html" %}
{% block title %}Editar documento — ESMA{% endblock %}
{% block page_title %}Editar documento{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <div class="card-hd"><h3>Editar documento</h3></div>
  <div class="card-bd">
    <form method="POST">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-group"><label>Nombre descriptivo</label>
        <input class="form-control" name="nombre" value="{{ doc.nombre }}" required></div>
      <div class="form-group"><label>Tipo</label>
        <select class="form-control" name="tipo">
          {% for t in ['contrato','reporte','manual','factura','foto','otro'] %}
          <option value="{{ t }}" {{ 'selected' if doc.tipo==t }}>{{ t|capitalize }}</option>
          {% endfor %}
        </select></div>
      <p style="font-size:12px;color:var(--mt)">Archivo actual: {{ doc.archivo }}</p>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="{{ next_url }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
