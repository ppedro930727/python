{% extends "base.html" %}
{% block title %}Nuevo incidente — ESMA{% endblock %}
{% block page_title %}Nuevo incidente{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('incidentes') }}">Incidentes</a> · Nuevo{% endblock %}
{% block content %}
<div class="card" style="max-width:680px">
  <div class="card-hd"><h3>Datos del incidente</h3></div>
  <div class="card-bd">
    <form method="POST">
      <div class="row">
        <div class="col"><div class="form-group"><label>Fecha *</label>
          <input class="form-control" type="date" name="fecha" value="{{ hoy }}" required></div></div>
        <div class="col"><div class="form-group"><label>Tipo</label>
          <select class="form-control" name="tipo">
            {% for t in ['ordeña','falla','operativo','seguridad','combustible'] %}
            <option value="{{ t }}">{{ t|capitalize }}</option>{% endfor %}
          </select></div></div>
      </div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Equipo (ECO)</label>
          <input class="form-control" name="codigo_eco" list="ecos" placeholder="EXC-001">
          <datalist id="ecos">{% for m in maquinas %}<option value="{{ m.eco }}">{{ m.nombre_equipo }}</option>{% endfor %}</datalist>
        </div></div>
        <div class="col"><div class="form-group"><label>Obra</label>
          <select class="form-control" name="id_obra">
            <option value="">— Ninguna —</option>
            {% for o in obras %}<option value="{{ o.id }}">{{ o.nombre }}</option>{% endfor %}
          </select></div></div>
      </div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Severidad</label>
          <select class="form-control" name="severidad">
            {% for s in ['bajo','medio','alto','critico'] %}
            <option value="{{ s }}" {{ 'selected' if s=='medio' }}>{{ s|capitalize }}</option>{% endfor %}
          </select></div></div>
        <div class="col"><div class="form-group"><label>Estado</label>
          <select class="form-control" name="estado">
            {% for e in ['abierto','en_proceso','cerrado'] %}
            <option value="{{ e }}">{{ e|replace('_',' ')|capitalize }}</option>{% endfor %}
          </select></div></div>
        <div class="col"><div class="form-group"><label>Responsable</label>
          <input class="form-control" name="responsable" placeholder="Responsable de seguimiento"></div></div>
      </div>
      <div class="form-group"><label>Descripción</label>
        <textarea class="form-control" name="descripcion" rows="3" placeholder="Describe el incidente..."></textarea></div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">Registrar incidente</button>
        <a href="{{ url_for('incidentes') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
