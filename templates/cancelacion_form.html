{% extends "base.html" %}
{% block title %}Nueva Solicitud de Cancelación — ESMA{% endblock %}
{% block page_title %}Nueva Solicitud de Cancelación de CFDI{% endblock %}
{% block content %}
<div class="card" style="max-width:650px">
  <div class="card-hd"><h3>Datos del comprobante a cancelar</h3></div>
  <div class="card-bd">
    <form method="POST">
      <div class="row">
        <div class="col"><div class="form-group"><label>Empresa</label>
          <select class="form-control" name="empresa" required>
            {% for e in empresas %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
          </select></div></div>
        <div class="col"><div class="form-group"><label>Obra</label>
          <select class="form-control" name="id_obra">
            <option value="">— Sin obra específica —</option>
            {% for o in obras %}<option value="{{ o.id }}">{{ o.nombre }}</option>{% endfor %}
          </select></div></div>
      </div>
      <div class="form-group"><label>Folio fiscal (UUID)</label>
        <input class="form-control" name="folio_fiscal" placeholder="Ej: 2A43D2E7-8962-4324-BC6F-6403CD793463" style="text-transform:uppercase"></div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Razón social</label>
          <input class="form-control" name="razon_social"></div></div>
        <div class="col"><div class="form-group"><label>RFC</label>
          <input class="form-control" name="rfc" style="text-transform:uppercase" maxlength="13"></div></div>
      </div>
      <div class="row">
        <div class="col"><div class="form-group"><label>Clave de cancelación SAT</label>
          <select class="form-control" name="clave_cancelacion">
            <option value="">— Seleccionar —</option>
            {% for c in claves %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
          </select></div></div>
        <div class="col"><div class="form-group"><label>Monto</label>
          <input class="form-control" type="number" step="0.01" min="0" name="monto"></div></div>
      </div>
      <div class="form-group"><label>CFDI que reemplaza (si aplica — clave 01)</label>
        <input class="form-control" name="cfdi_reemplaza" placeholder="Folio fiscal del CFDI de reemplazo" style="text-transform:uppercase"></div>
      <div class="form-group"><label>Fecha de solicitud</label>
        <input class="form-control" type="date" name="fecha_solicitud"></div>
      <div class="form-group"><label>Justificación</label>
        <textarea class="form-control" name="justificacion" rows="3" required placeholder="Ej: Factura emitida sin retenciones"></textarea></div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary">Registrar solicitud</button>
        <a href="{{ url_for('cancelaciones') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
